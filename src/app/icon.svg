<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Quick Scanner">
  <defs>
    <linearGradient id="qs-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="qs-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="qs-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#qs-bg)"/>

  <g transform="rotate(-6 32 31)">
    <rect x="20" y="15" width="24" height="32" rx="3" fill="#F8FAFC"/>
    <path d="M36 15 L44 15 L44 23 Z" fill="#CBD5E1"/>
    <rect x="24" y="22" width="16" height="2.2" rx="1.1" fill="#94A3B8"/>
    <rect x="24" y="27.5" width="16" height="2.2" rx="1.1" fill="#94A3B8"/>
    <rect x="24" y="33" width="10" height="2.2" rx="1.1" fill="#CBD5E1"/>
    <rect x="17" y="28.5" width="30" height="3" rx="1.5" fill="url(#qs-scan)" filter="url(#qs-glow)"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M10 18 L10 10 L18 10"/>
    <path d="M46 10 L54 10 L54 18"/>
    <path d="M10 46 L10 54 L18 54"/>
    <path d="M54 46 L54 54 L46 54"/>
  </g>
</svg>
